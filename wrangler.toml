# Cloudflare Pages 설정 — 데이터베이스 연결(바인딩)을 이 파일에서 관리합니다.
# · 이 파일이 있으면 Cloudflare 대시보드의 '바인딩' 화면에서는 고칠 수 없고, 여기를 고쳐 커밋하면 반영됩니다.
# · 비밀 값(ADMIN_PASSWORD 등)은 지금처럼 대시보드 → 설정 → 변수 및 비밀에서 넣습니다. 이 파일에는 비밀 값이 없습니다.
# · DB 는 이 홈페이지의 데이터, DB_… 는 관리자 '전체 문의'에서 읽기만 하는 다른 사이트의 데이터입니다.
name = "choisijun"
pages_build_output_dir = "."
compatibility_date = "2026-07-24"

[[d1_databases]]
binding = "DB"
database_name = "choisijun-db"
database_id = "60c174d3-440c-4468-a57f-90060df35789"

# ---- 아래는 '전체 문의'용 (읽기만 함) ----
